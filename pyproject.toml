[project]
name = "swarmharness"
version = "0.1.0"
description = "Docker-isolated, provider-agnostic agent eval harness: key-injecting LLM proxy, fail-closed verifiers, redacted artifacts"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12",
    "tomli>=2.0; python_version < '3.11'",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.scripts]
swarm = "swarmharness.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarmharness"]
